{% extends "quiz/base.html" %}
{% block title %}新しいゲーム | ネプリ―グ！{% endblock %}
{% block content %}
<section class="setup-shell">
  <div class="setup-card">
    <p class="screen-kicker">HOST SETUP</p>
    <h1>ゲームをはじめる</h1>
    <p class="lead">司会・大画面・参加者用のURLをまとめて作成します。</p>
    <form action="{% url 'quiz:new_game' %}" method="post" class="setup-form">
      {% csrf_token %}
      <label>ゲーム名<input name="title" value="文化祭クイズ" maxlength="100" /></label>
      <div class="form-columns">
        <label>出題数<input name="question_count" type="number" value="10" min="1" max="100" /></label>
        <label>制限時間（秒）<input name="seconds" type="number" value="20" min="5" max="120" /></label>
      </div>
      <button class="button button-red" type="submit">司会画面を作る</button>
    </form>
    <p class="help-text">問題は先に <a href="/admin/">Django Admin</a> から登録します。</p>
  </div>
</section>
{% endblock %}
